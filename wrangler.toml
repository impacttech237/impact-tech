# ------------------------------------------------------------------
# IMPACT TECH — Configuration Cloudflare Worker (Hono, sans Next.js)
# Build  : npm run build   (Tailwind CSS + bundle client via esbuild)
# Deploy : npx wrangler deploy
#
# Variables/secrets a definir dans le dashboard (Settings > Variables
# and Secrets) ou via `wrangler secret put` :
#   - ADMIN_PASSWORD : mot de passe du dashboard admin (/admin)
#   - AUTH_SECRET    : chaine aleatoire longue pour signer les sessions
#   - RESEND_API_KEY : cle API Resend — envoi des emails (portail client,
#                      RDV). Sans elle, aucun email ne part.
#   - VAULT_KEY      : (optionnel) cle de chiffrement du coffre d'acces du
#                      portail client ; a defaut AUTH_SECRET est utilise.
#   - NOTION_TOKEN   : jeton d'integration interne Notion (optionnel) —
#                      synchronise chaque demande de devis vers la base
#                      "CRM — Prospects & Clients". Sans ce secret, le
#                      formulaire fonctionne normalement (D1 seulement).
# ------------------------------------------------------------------
name = "impact-tech"
main = "src/worker.tsx"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "impact-tech-db"
database_id = "afaeac82-b728-4095-a4ff-a2053a5a9b55"

# Stockage objet des médias uploadés depuis le dashboard (images d'articles).
# Servis publiquement via la route GET /media/* du worker.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "impact-tech-media"

# Tache quotidienne (8h heure de Douala) : relances clients, renouvellements,
# sante des sites livres, recap du lundi. Voir src/cron.ts.
[triggers]
crons = ["0 7 * * *"]

[observability]
enabled = true
